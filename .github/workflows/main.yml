# .github/workflows/generate.yml
name: Generate External Docs

on:
  # 1. Manual Trigger (for testing)
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch/Tag of source repo to process'
        default: 'main'
        required: false

  # 2. Automated Trigger from Gearbox Studio
  repository_dispatch:
    types: [generate-docs]

jobs:
  generate:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the new docs
      
    steps:
      # --- SETUP ---
      - name: Checkout AutoDocs (This Repo)
        uses: actions/checkout@v4
        with:
          path: autodocs-tool

      - name: Checkout Source Repo (Gearbox Studio)
        uses: actions/checkout@v4
        with:
          # REPLACE WITH YOUR ACTUAL SOURCE REPO
          repository: Wasif-ZA/Gearboxstudio
          path: external-source
          # Use the SHA provided by the dispatch event, or default to main
          ref: ${{ github.event.client_payload.sha || inputs.source_ref || 'main' }}
          token: ${{ secrets.GH_PAT_TOKEN }} # Needed if Gearbox Studio is private

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- DEPENDENCIES ---
      - name: Install AutoDocs Dependencies
        run: |
          cd autodocs-tool
          npm ci

      # OPTIONAL: Install Source Dependencies
      # This helps ts-morph resolve types from 3rd party libraries correctly.
      - name: Install Source Dependencies
        run: |
          cd external-source
          npm ci || echo "Warning: Could not install source deps, type extraction might be less accurate"

      # --- GENERATION ---
      - name: Run AutoDocs Generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd autodocs-tool
          
          # Construct the override JSON
          # We point 'components' to the checkout path of the other repo
          OVERRIDES='{"paths": {"components": "../external-source/src/components"}}'
          
          # Run the tool
          # --no-cache: We always want fresh docs for cross-repo builds
          npm run autodocs -- generate --no-cache --overrides "$OVERRIDES"

      # --- COMMIT ---
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: autodocs-tool
          commit_message: "docs: update from gearbox-studio ${{ github.event.client_payload.sha || 'manual' }}"
          file_pattern: 'pages/docs/** .autodocs/**' # Commit docs and suggestions
